name: Build Test

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore all existing projects
        run: find . -name "*.csproj" -exec dotnet restore {} \;

      - name: Build all existing projects
        run: find . -name "*.csproj" -exec dotnet build {} --configuration Release \;
